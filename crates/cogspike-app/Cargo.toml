# cogspike-app: the eframe/egui workbench + gym front-end.
# The binary is named `cog_spike` so the trunk/WASM artifact stays `cog_spike_bg.wasm`
# (see crates/cogspike-app/index.html `data-bin` and assets/sw.js).
[package]
name = "cogspike-app"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
default-run = "cog_spike"

[[bin]]
name = "cog_spike"
path = "src/main.rs"

[dependencies]
cog_spike = { path = "../cogspike-core" }
egui = "0.33.0"
eframe = { version = "0.33.0", default-features = false, features = [
    "accesskit",     # Make egui compatible with screen readers. NOTE: adds a lot of dependencies.
    "default_fonts", # Embed the default egui fonts.
    "glow",          # Use the glow rendering backend. Alternative: "wgpu".
    "persistence",   # Enable restoring app state when restarting the app.
    "wayland",       # To support Linux (and CI)
    "x11",           # To support older Linux distributions (restores one of the default features)
] }
log = "0.4.27"

# You only need serde if you want app persistence:
serde = { version = "1.0.219", features = ["derive"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"              # to access the DOM (to hide the loading text)

[lints]
workspace = true
