# cogspike-core: the egui-free simulation / coder / formal-verification library.
# The library crate is named `cog_spike` so existing `use cog_spike::...` imports
# (integration tests, the app crate) keep working unchanged.
[package]
name = "cog_spike"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]

[lib]
name = "cog_spike"

# Headless diagram-export CLI (native-only; self-contained, reimplements the paper-accurate sim).
[[bin]]
name = "export"
path = "src/bin/export.rs"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
anyhow = "1.0.94"
rand = "0.8"

# native-only:
#   tempfile — used by the native PRISM `LocalPrism` model-checker (cfg-gated off wasm)
#   clap, plotters — used by the `export` diagram CLI bin
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tempfile = "3.14.0"
clap = { version = "4", features = ["derive"] }
plotters = "0.3"

# wasm-only: `rand` pulls in `getrandom`, which needs its JS backend on
# wasm32-unknown-unknown. In the old single-crate layout this came for free via
# feature unification with eframe; the now-isolated core lib must opt in itself so
# `cargo check --lib --target wasm32-unknown-unknown` resolves.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1"          # parse the coder parity golden fixtures

[lints]
workspace = true
